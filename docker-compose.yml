services:
  api:
    build: .
    container_name: streamlab-api
    restart: always
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
    networks:
      - streamlab-net

networks:
  streamlab-net:
    external: true